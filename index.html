<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />

    <meta name="author" content="Ihsan Hadhrami" />

    <!--
      HEAD TAG OWNERSHIP — split deliberately, because React does not dedupe
      <title>, <meta>, or <link>. Declaring the same tag in both places
      leaves two conflicting copies on every page.

        index.html (here)  ->  og:* and twitter:* tags.
        <Seo> component    ->  <title>, description, canonical.

      Social scrapers (Facebook, LinkedIn, Slack, X) do NOT execute
      JavaScript, so they only ever see this static HTML — that is why the
      sharing tags must live here rather than in React. The trade-off is
      that link previews are site-level, not per-route; per-route cards
      would require prerendering or SSR.

      Conversely <title>/description/canonical are owned by <Seo> so each
      route gets its own, which search engines (which do render JS) and
      browser tabs both need.

      The title and description below are a hand-kept copy of SITE.name +
      SITE.role and SITE.shortBio from src/constants/site.ts. Static HTML
      cannot import them, so seo.spec asserts the two copies still agree
      on the home route rather than trusting them to.
    -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Ihsan Hadhrami" />
    <meta property="og:title" content="Ihsan Hadhrami — Web Developer & Automation Engineer" />
    <meta
      property="og:description"
      content="Developer and automation engineer building backend tools that remove manual work, with a focus on Arabic language technology."
    />
    <meta property="og:url" content="https://ihsanhadhrami.com/" />
    <meta property="og:image" content="https://ihsanhadhrami.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ihsan Hadhrami — Web Developer & Automation Engineer"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ihsan Hadhrami — Web Developer & Automation Engineer" />
    <meta
      name="twitter:description"
      content="Developer and automation engineer building backend tools that remove manual work, with a focus on Arabic language technology."
    />
    <meta name="twitter:image" content="https://ihsanhadhrami.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
