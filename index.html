<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />

    <title>Ihsan Hadhrami — Web Developer & Digital Product Engineer</title>
    <meta
      name="description"
      content="Ihsan Hadhrami is a web developer and digital product engineer crafting fast, accessible, and beautifully engineered digital products with React, TypeScript, and modern tooling."
    />
    <meta name="author" content="Ihsan Hadhrami" />
    <!--
      Canonical is set per-route by the <Seo> component (src/components/seo.tsx)
      so each page gets its own correct URL. It is intentionally NOT declared
      here: React does not dedupe <link rel="canonical">, so a static tag would
      leave two conflicting canonicals on every inner page.
    -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ihsan Hadhrami — Web Developer & Digital Product Engineer" />
    <meta
      property="og:description"
      content="Crafting fast, accessible, and beautifully engineered digital products."
    />
    <meta property="og:url" content="https://ihsanhadhrami.com/" />
    <meta property="og:image" content="https://ihsanhadhrami.com/favicon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ihsan Hadhrami — Web Developer & Digital Product Engineer" />
    <meta
      name="twitter:description"
      content="Crafting fast, accessible, and beautifully engineered digital products."
    />
    <meta name="twitter:image" content="https://ihsanhadhrami.com/favicon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms detects form schemas by scanning static HTML at build
      time — it never sees the React-rendered form in src/components/
      sections/contact-form.tsx. This hidden twin exists purely so Netlify
      registers the "contact" form and its fields; the real form submits
      to it via a matching fetch POST rather than a native submit.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
