<!doctype html>
<!--
  Source for public/og-image.png, the 1200x630 link-preview card.
  Regenerate with `npm run og-image` after changing the positioning in
  src/constants/site.ts, and bump the `?v=` on the og:image / twitter:image
  URLs in index.html so platforms that cache by image URL refetch it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@500;600&family=Syne:wght@700;800&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: oklch(0.16 0.004 285);
        color: oklch(0.96 0.002 285);
        font-family: 'Manrope', sans-serif;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            700px 420px at 88% 0%,
            oklch(0.7 0.16 285 / 0.28),
            transparent 70%
          ),
          radial-gradient(
            500px 360px at 0% 100%,
            oklch(0.7 0.16 285 / 0.1),
            transparent 70%
          );
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(oklch(1 0 0 / 0.04) 1px, transparent 1px),
          linear-gradient(90deg, oklch(1 0 0 / 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to bottom, black, transparent 75%);
      }
      .top,
      .bottom {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        border: 1px solid oklch(0.7 0.16 285 / 0.35);
        background: oklch(0.7 0.16 285 / 0.12);
        color: oklch(0.7 0.16 285);
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 26px;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 22px;
        color: oklch(0.7 0.012 285);
      }
      .main {
        position: relative;
      }
      h1 {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 96px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .role {
        margin-top: 22px;
        font-size: 40px;
        font-weight: 600;
        color: oklch(0.7 0.16 285);
      }
      .chips {
        display: flex;
        gap: 12px;
      }
      .chip {
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid oklch(1 0 0 / 0.14);
        background: oklch(0.19 0.005 285 / 0.8);
        font-size: 22px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>

    <div class="top">
      <div class="mark">IH</div>
      <span class="mono">ihsanhadhrami.com</span>
    </div>

    <div class="main">
      <h1>Ihsan Hadhrami</h1>
      <p class="role">AI Application Developer</p>
    </div>

    <div class="bottom">
      <div class="chips">
        <span class="chip">RAG</span>
        <span class="chip">Agentic AI</span>
        <span class="chip">Arabic NLP</span>
      </div>
      <span class="mono">+ full-stack web</span>
    </div>
  </body>
</html>
